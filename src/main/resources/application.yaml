spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      ttl:
        event: 1800

server:
  port: 8080

logging:
  level:
    root: info

services:
  project-service:
    host: localhost
    port: 8082

  payment-service:
    host: localhost
    port: 9080

jobs:
  redis:
    promotion:
      cron: "*/15 * * * * *"
      # Каждые 15 секунд