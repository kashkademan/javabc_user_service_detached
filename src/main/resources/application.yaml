spring:

  config:
    import: optional:classpath:application.properties

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: ${APP_ENV}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

server:
  port: 8080

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

user:
  avatar:
    max:
      sizeMb: 5
    allowed:
      types: "image/png,image/jpeg,image/jpg,image/webp"
  password:
    min:
      length: 6
  max-ids-per-request: 100

skills:
  min-offers-for-acquire: 3

services:
  s3:
    endpoint: ${MINIO_ENDPOINT}:${MINIO_PORT}
    accessKey: ${MINIO_ACCESS_KEY}
    secretKey: ${MINIO_SECRET_KEY}
    bucketName: ${MINIO_BUCKET_NAME}

redis:
  topics:
    name:
      user-ban-topic: "user-ban-topic"

scheduler:
  clear-events:
    cron: "0 0 3 ? * MON"
    batch-size: 10000
    threads: 4
    await-termination-hours: 1