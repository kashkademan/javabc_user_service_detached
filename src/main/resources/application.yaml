spring:
  application:
    name: User Service
    version: 1.0.0
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer


promotion-redis:
  ttl: 1d
  time:
    fixedRate: 600000  #милисекунды
    initialDelay: 50  #милисекунды
  promotions:
    BASIC: 5
    ADVANCED: 10
    EXPERIENCE: 50
    LEGEND: 100


server:
  port: 8080

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

user:
  password:
    min:
      length: 6

goal:
  max-active-goals: 2

cloud:
  aws:
    region:
      static: default

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: corpbucket
    isMocked: false

avatar:
  default:
    template: |
      <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="40" fill="#%s"/>
        <text x="50" y="60" text-anchor="middle" fill="white" font-size="20">👤</text>
      </svg>
  base-folder: "avatars"
  file-extension: ".png"
  content-type: "image/png"

dice:
  bear:
    client:
      baseUrl: https://api.dicebear.com/7.x
      default-style: adventurer


topics:
  defaults:
    partitions: 3
    replicas: 1
  notifications:
    like-received: notifications.like-received
  analytics:
    profile-view: analytics.profile-view
  achievements:
    goal-completed: achievements.goal-completed
