spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        profile-view: profile_view_channel
        mentorship-request: MentorShipRequestTopic
        goal-completing-channel: goal-completing-channel
        user-ban: user-ban
        recommendationReceived: recommendation_event_channel
        follower: follower_channel
        mentorship-accepted-event: mentorship-accepted-channel
        skill-acquired: skill_acquired_channel
    kafka:
      bootstrap-servers: localhost:9092
      topic:
        userBan: user_ban
        followers-request:
          name: "post-followers-topic"
          partitions: 3
          replicas: 1
        posts:
          name: "posts-topic"
          partitions: 3
          replicas: 1
        author-request:
          name: "author-request-topic"
          partitions: 3
          replicas: 1
        author-response:
          name: "author-response-topic"
          partitions: 3
          replicas: 1
        feed-warmup:
          name: "feed-warmup-topic"
          partitions: 3
          replicas: 1
        feed-users-response:
          name: "feed-users-response-topic"
          partitions: 3
          replicas: 1
      producer:
        retry-backoff-ms: 1000
        acks: all
        enable-idempotence: true
      consumer:
        group-id: user-group
        auto-offset-reset: earliest

  profiles:
    active: local

server:
  port: 8080

logging:
  level:
    root: debug

s3:
  endpoint: http://localhost:9000
  accessKey: user
  secretKey: password
  bucketName: corpbucket
  region: us-east-1
  isMocked: false
  otherBuckets:
    user-avatar-bucket

dicebear:
  initials-url: https://api.dicebear.com/9.x/initials/png

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
  api-docs:
    path: /v3/api-docs

  app:
    security:
      password-length: 10

thread-pool:
  delete-events-max-threads: 3

cron:
  delete-events: 0 30 18 * * THU
