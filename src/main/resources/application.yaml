spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  web:
    servlet:
      context-path: /api/v1

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost

server:
  port: 8080

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

logic:
  constants:
    max_active_goals: 3
    picture_provider_root: https://api.dicebear.com/9.x/identicon/svg
    default_small_avatar_seed: rotate=10&scale=80&row1=xooox&row2=oxoxo&row3=ooxoo&row4=oxoxo&row5=xooox&rowColor=00acff

feign:
  client:
    config:
      payment-service:
        url: http://localhost:9080

# OpenApi configs
springdoc:
    swagger-ui:
        path: /swagger-ui
        enabled: true
    api-docs:
        path: /api-docs