spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      database: 0


server:
  port: 8080

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

user:
  password:
    min:
      length: 6

recommendation-request:
  cooldown:
    month: 6

schedule:
  event-cleanup: "0 0 0 * * *"
  timezone: "Europe/Moscow"

event:
  cleanup:
    batch-size: 100
    timeout-sec: 30

services:
  s3:
    endpoint: http://localhost:9000
    access-key: user
    secret-key: password
    bucketName: testbacket
    isMocked: false

redis:
  topic:
    recommendation-request: "recommendation_request_topic"
    recommendation: "recommendation_topic"
    post-published: "post_published_topic"
    subproject-create: "subproject_create_topic"
  keys:
    leaderboard: global_leaderboard;
  warmup:
    top-users-limit: 10000
    top-users-offset: 0

retry:
  config:
    max-attempts: 3
    initial-interval-ms: 1000
    multiplier: 2.0
    max-interval-ms: 10_000

generate-ava:
  dice:
    base-url: https://api.dicebear.com/9.x

app:
  async:
    postgres:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 10_000
    task-executor:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 100



