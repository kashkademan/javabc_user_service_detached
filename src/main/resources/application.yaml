spring:
  application:
    name: User Service
    version: 1.0.0
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.add.type.headers: false
    properties:
      acks: 1
      retries: 3
      enable.idempotence: true
      request.timeout.ms: 30000
      max.block.ms: 60000
  lifecycle:
    timeout-per-shutdown-phase: 1s

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB


promotion-redis:
  ttl: 1d
  time:
    fixedRate: 600000  #милисекунды
    initialDelay: 50  #милисекунды
  promotions:
    BASIC: 5
    ADVANCED: 10
    EXPERIENCE: 50
    LEGEND: 100


server:
  port: 8080
  shutdown: graceful

logging:
  level:
    root: info

springdoc:
  swagger-ui:
    persist-authorization: true

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

user:
  password:
    min:
      length: 6

goal:
  max-active-goals: 2

cloud:
  aws:
    region:
      static: default

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: corpbucket
    isMocked: false
    user-avatars:
      bucket-name: user-avatars
      max-file-size: 5242880

avatar:
  default:
    template: |
      <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="40" fill="#%s"/>
        <text x="50" y="60" text-anchor="middle" fill="white" font-size="20">👤</text>
      </svg>
  base-folder: "avatars"
  file-extension: ".png"
  content-type: "image/png"

dice:
  bear:
    client:
      baseUrl: https://api.dicebear.com/7.x
      default-style: adventurer


topics:
  notifications:
    like-received: notifications.like-received #example
  analytics:
    profile-view: analytics.profile-view
  achievements:
    goal-completed: achievements.goal-completed #example
  events: event.events

leader-board:
  scores:
    goal_created_by_user: 2
    goal_created_by_mentor: 3
    goal_completed: 5
    career_added: 1
  max-leaders: 3
  redis-key: "leaderBoard"