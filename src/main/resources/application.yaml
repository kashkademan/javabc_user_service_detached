spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost


promotion-redis:
  ttl: 1d
  time:
    fixedRate: 600000  #милисекунды
    initialDelay: 50  #милисекунды
  promotions:
    BASIC: 5
    ADVANCED: 10
    EXPERIENCE: 50
    LEGEND: 100


server:
  port: 8081

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

user:
  password:
    min:
      length: 6

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: corpbucket
    isMocked: false

dice:
  bear:
    client:
      baseUrl: https://api.dicebear.com/7.x

