spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost

  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

kafka:
  topic:
    mentorship-offer: mentorship_offer_topic
    user-ban: user_ban

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: info

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: userbucket
    region: us-east-1
    isMocked: false

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

user:
  password:
    min:
      length: 6
  skill:
    recommendation:
      min: 3


max-active-goals: 2

recommendation:
  request:
    timeForRequest: 6

mentorship:
  request:
    periodForRequest: 3

clients:
  dice-bear-client:
    host: https://api.dicebear.com
    api-version: /9.x
    style-name: /adventurer
    format: /svg
    size: 100

scheduler:
  clear-events-cron: "0 14 * * * ?"
  batch-size: 1000
  time-out: 180