spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: user-service-group
    topics:
      goal-completed-topic:
        name: goal-completed
      subscription:
        new-follower-topic:
          name: new-follower-events
        unfollow-topic:
          name: unfollow-events

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

logging:
  level:
    root: info
    school.faang.user_service.client: debug

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    docExpansion: none
    displayRequestDuration: true
    defaultModelsExpandDepth: -1

goal:
  maxLimit: 3

services:
  s3:
    endpoint: http://localhost:9000
    accessKey: user
    secretKey: password
    bucketName: corpbucket
    avatarPath: avatar/generated
  dicebear:
    url: http://localhost:3000
    version: 9.x
    style: pixel-art
    format: png

scheduler:
  past-event-clean:
    # каждый день в 4 часа ночи
    cron: "0 0 4 * * *"
    zone: "Europe/Moscow"
    batch-size: 5000
    fetch-limit: 1000000
    executor-config:
      core-pool-size: 20
      max-pool-size: 50
      thread-name-prefix: 'EventCleaner-'