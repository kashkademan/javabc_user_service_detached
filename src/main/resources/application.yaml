spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost

  redis:
    channels:
      profile_pic: profile_pic_channel

server:
  port: 8090

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

minio:
  end_point: "http://localhost:9000"
  access_key: "user"
  secret_key: "password"
  region: "us-east-1"
  bucket: "user-pictures-bucket"
  content_length: 20_971_520

dice-bear-api: "https://api.dicebear.com/9.x/pixel-art/svg"