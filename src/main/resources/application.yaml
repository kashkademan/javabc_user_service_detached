spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  web:
    servlet:
      context-path: /api/v1

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost

app:
  scheduler:
    premium-remove:
      cron: "0 59 23 * * SUN"
      enabled: true

server:
  port: 8080

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

logic:
  constants:
    max_active_goals: 3

feign:
  client:
    config:
      payment-service:
        url: http://localhost:9080

# OpenApi configs
springdoc:
    swagger-ui:
        path: /swagger-ui
        enabled: true
    api-docs:
        path: /api-docs