spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      ttl:
        event: 1800
      lock:
        promotion:
          expire-time: 3000
          max-retries: 10
          retry-delay: 300

server:
  port: 8080

logging:
  level:
    root: info

services:
  project-service:
    host: localhost
    port: 8082

  payment-service:
    host: localhost
    port: 9080

  dice-bear:
    url: https://api.dicebear.com
    version: 9.x

  s3:
    host: localhost
    post: 9000
    accessKey: user
    secretKey: password
    bucketName: corpbucket

jobs:
  promotion:
    close:
      cron: "*/15 * * * * *"
        # Каждые 15 секунд

system:
  user-id: -1
