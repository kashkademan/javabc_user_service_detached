spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost

server:
  port: 8080

logging:
  level:
    root: info
    school.faang.user_service.client.PaymentServiceClient: DEBUG
    feign: DEBUG

cloud:
  aws:
    s3:
      bucket: faang-user-avatars
      region: ru-central1
      endpoint: https://storage.yandexcloud.net
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}

project-service:
  host: localhost
  port: 8082

payment-service:
  host: http://localhost:9090/api

user:
  password:
    min:
      length: 6