apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice-deployment
spec:
  selector:
    matchLabels:
      app: userservice
  replicas: 3
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
        - name: userservice
          image: image-registry.openshift-image-registry.svc:5000/uralostrov6-dev/userservice:latest
          ports:
            - containerPort: 8080