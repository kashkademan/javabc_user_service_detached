name: Java Gradle Build

on:
  push:
    branches: [ "cerberus-master-stream10" ]
  pull_request:
    branches: [ "cerberus-master-stream10" ]

jobs:
  build-and-test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Compile code
        run: ./gradlew assemble --no-daemon

      - name: Run Gradle tests
        run: ./gradlew test

#      - name: Run tests with coverage
#        run: mvn test jacoco:report

      - name: Comment on Pull Request if build failed
        if: failure()
        uses: actions/github-script@v5
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const issue_number = context.issue.number;
            const message = "⚠️ **Ты всё сломал, увольняйся!!!**: Сборка завалилась: либо ошибки компиляции, либо не прошли тесты, либо возникли ошибки в стиле кода. Пожалуйста, проверь логи и внеси соответствующие изменения в ПР. После этого красная ошибка ниже должна пропасть, но этот комментарий останется - так и должно быть.";
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: message
            });