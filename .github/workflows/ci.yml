name: Java Gradle Build

on:
  push:
    branches: [ "cerberus-master-stream10" ]
  pull_request:
    branches: [ "cerberus-master-stream10" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Run Gradle tests
        run: ./gradlew test